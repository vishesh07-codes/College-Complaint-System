<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submit Complaint - College Complaint System</title>

    <link rel="stylesheet" href="css/admin-submit.css">

    <!-- Font Awesome -->
    <!-- <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"> -->

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <div class="student-navbar">

        <div class="student-brand">

            <i class="fa-solid fa-building-columns"></i>

            <span>College Complaint System</span>

        </div>


        <div class="student-user">

            <i class="fa-solid fa-bell"></i>

            <i class="fa-solid fa-circle-user"></i>

            <span>Vishesh Singhal</span>

            <i class="fa-solid fa-chevron-down"></i>

        </div>

    </div>



    <!-- ================= MAIN LAYOUT ================= -->

    <div class="student-layout">


        <!-- ================= SIDEBAR ================= -->

        <aside class="student-sidebar">


            <a href="dashboard.html" class="student-link">

                <i class="fa-solid fa-house"></i>

                <span>Dashboard</span>

            </a>


            <a href="submit.html" class="student-link active">

                <i class="fa-solid fa-file-circle-plus"></i>

                <span>Submit Complaint</span>

            </a>


            <a href="complaints.html" class="student-link">

                <i class="fa-solid fa-list"></i>

                <span>My Complaints</span>

            </a>


            <a href="#" class="student-link">

                <i class="fa-solid fa-user"></i>

                <span>Profile</span>

            </a>


            <a href="#" class="student-link">

                <i class="fa-solid fa-key"></i>

                <span>Change Password</span>

            </a>


            <a href="login.html" class="student-link logout">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </a>


        </aside>



        <!-- ================= CONTENT ================= -->

        <main class="submit-content">


            <div class="submit-header">

                <h1>Submit New Complaint</h1>

                <p>
                    Please provide the details of your complaint below.
                </p>

            </div>



            <!-- ================= FORM CARD ================= -->

            <div class="submit-card">


                <form action="#" method="post">


                    <!-- Category -->

                    <div class="form-group">

                        <label for="category">
                            Complaint Category
                        </label>

                        <select id="category" name="category" required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="hostel">
                                Hostel
                            </option>

                            <option value="it">
                                IT/Computer
                            </option>

                            <option value="mess">
                                Mess
                            </option>

                            <option value="infrastructure">
                                Infrastructure
                            </option>

                            <option value="library">
                                Library
                            </option>

                            <option value="transport">
                                Transport
                            </option>

                            <option value="other">
                                Other
                            </option>

                        </select>

                    </div>



                    <!-- Subject -->

                    <div class="form-group">

                        <label for="subject">
                            Subject
                        </label>

                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter complaint subject"
                            required
                        >

                    </div>



                    <!-- Description -->

                    <div class="form-group">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            name="description"
                            rows="6"
                            placeholder="Write your complaint in detail..."
                            required
                        ></textarea>

                    </div>



                    <!-- Submit -->

                    <button type="submit" class="complaint-submit-btn">

                        <i class="fa-solid fa-paper-plane"></i>

                        Submit Complaint

                    </button>


                </form>


            </div>


        </main>

    </div>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 College Complaint System. All Rights Reserved.

    </footer>


</body>

</html>
